# Sitio estático detrás de Nginx Proxy Manager y Cloudflare Tunnel.
# HTTPS y HSTS los pone Cloudflare; aquí van las cabeceras de seguridad y la caché.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    # La CSP va en un <meta> que genera Astro con los hashes; frame-ancestors solo funciona como cabecera.
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Archivos con hash en el nombre: nunca cambian, caché de un año.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location /media/ {
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # HTML: siempre revalidar, para que un cambio se vea al tiro.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}
