# Verifica cada cambio y, en main, publica el sitio en Hostinger por SSH (rsync).
name: Publicar

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: publicar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: sitio
          path: dist/
          include-hidden-files: true
          retention-days: 1

  publicar:
    needs: verificar
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: produccion
      url: https://npavez.com
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: sitio
          path: dist
      - name: Preparar SSH
        env:
          CLAVE: ${{ secrets.HOSTINGER_CLAVE_SSH }}
          KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CLAVE" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      # --delete deja el servidor igual que dist/; .well-known se conserva (validación del certificado).
      - name: Subir a Hostinger
        env:
          HOST: ${{ secrets.HOSTINGER_HOST }}
          PUERTO: ${{ secrets.HOSTINGER_PUERTO }}
          USUARIO: ${{ secrets.HOSTINGER_USUARIO }}
          RUTA: ${{ secrets.HOSTINGER_RUTA }}
        run: rsync -rlz --delete --exclude=.well-known -e "ssh -p $PUERTO" dist/ "$USUARIO@$HOST:$RUTA/"
