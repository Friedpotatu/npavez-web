# Raspberry Pi: copiar a ~/stacks/npavez-web/ junto con actualizar.sh y levantar con
#   docker compose up -d
# Nginx Proxy Manager alcanza el contenedor por su nombre en la red compartida (npavez-web:8080).
services:
  web:
    image: ghcr.io/friedpotatu/npavez-web:latest
    container_name: npavez-web
    restart: unless-stopped
    # Sitio estático: sistema de archivos de solo lectura, sin privilegios ni capacidades extra.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy

networks:
  proxy:
    name: nginx-proxy-manager_default
    external: true
